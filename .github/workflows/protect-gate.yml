name: Protect Password Gate
on:
  push:
    branches:
      - gh-pages

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Inject password gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          pip install requests -q
          echo "" | base64 -d > /tmp/gate.html
          python3 << 'SCRIPT'
          import requests, base64, re, os
          REPO = "gujixiaojie/link-status"
          TOKEN = os.environ["GH_TOKEN"]
          h = {"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json"}
          r = requests.get(f"https://api.github.com/repos/{REPO}/contents/index.html?ref=gh-pages", headers=h)
          j = r.json()
          html = base64.b64decode(j["content"]).decode()
          if "__gate__" in html:
              print("Gate already present, skip.")
              exit(0)
          gate = open("/tmp/gate.html").read()
          html2 = re.sub(r'<head[^>]*>', lambda m: m.group(0) + gate, html, count=1)
          payload = {"message": "Re-inject password gate", "content": base64.b64encode(html2.encode()).decode(), "sha": j["sha"]}
          r2 = requests.put(f"https://api.github.com/repos/{REPO}/contents/index.html?ref=gh-pages", headers=h, json=payload)
          print("Injected:", r2.status_code)
          SCRIPT
