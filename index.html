<!DOCTYPE html> <html lang=en> <head><script>

(function(){
var GOODHASHES = ["T66hslhYzr0ySI32ygw9zzDk1V5Y3/jSdSrcKCNE1q8=","Dncpm015G5xYUr04cvus2jfONNNmMv2f8w1jodEgYu4="];
var SITES_DATA_URL = "./api-data.json";

// 翻译
var I18N = {
  "Overall uptime":"可用率",
  "Average response time":"平均响应",
  "Active Incidents":"活跃事件",
  "All systems operational":"所有系统正常",
  "Live Status":"实时状态",
  "Past Incidents":"历史事件",
  "This page is open source, powered by":"本页基于开源项目构建",
  "Subscribe":"订阅",
  "is down":"故障",
  "Resolved in":"恢复用时",
  "minutes":"分钟",
  "posts":"条记录",
  "Opened at":"开始时间",
  "Incident":"事件",
  "report":"报告",
  "No incidents":"暂无事件"
};

function tr(){
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n;
  while(n=w.nextNode()){
    var t=n.textContent;
    if(!t)continue;
    for(var e in I18N){
      if(t.indexOf(e)!==-1){
        n.textContent=t.split(e).join(I18N[e]);
      }
    }
  }
}

function hideStuff(){
  var links=document.querySelectorAll("a");
  for(var i=0;i<links.length;i++){
    if(links[i].href&&links[i].href.indexOf("github.com/")!==-1){
      links[i].style.display="none";
    }
  }
}

// 渲染站点列表
function renderSites(sites){
  // 按响应时间排序（0排最后）
  sites.sort(function(a,b){
    var ra=a.rt_overall||99999;
    var rb=b.rt_overall||99999;
    return ra-rb;
  });

  // 找站点列表 section（第二个 section.svelte-8lnl4f）
  var sections=document.querySelectorAll("main > section.svelte-8lnl4f");
  if(sections.length<2)return;
  var siteSection=sections[1];

  // 清空原有 loading 内容
  siteSection.innerHTML="";

  // 创建工具栏
  var toolbar=document.createElement("div");
  toolbar.style.cssText="position:sticky;top:0;z-index:100;background:#fff;padding:10px 12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;";
  toolbar.innerHTML='<input id="__search__" type="text" placeholder="搜索站点..." style="flex:1;min-width:120px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;" />'+
    '<label style="font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="__faultonly__" style="cursor:pointer;">只看故障</label>'+
    '<button id="__dark__" style="padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;">暗色</button>';
  siteSection.appendChild(toolbar);

  // 分组：每1/3一组
  var goodSites=sites.filter(function(s){return s.uptime_day>=100;});
  var faultSites=sites.filter(function(s){return s.uptime_day<100;});

  var allSites=goodSites.concat(faultSites);
  var third=Math.ceil(allSites.length/3);

  var container=document.createElement("div");
  container.id="__sites_container__";

  for(var g=0;g<3;g++){
    var start=g*third;
    var end=Math.min(start+third,allSites.length);
    if(start>=allSites.length)break;

    var groupTitle=document.createElement("div");
    groupTitle.style.cssText="font-size:16px;font-weight:bold;margin:16px 0 8px;padding:6px 12px;background:#3b82f6;color:#fff;border-radius:6px;";
    groupTitle.textContent="第 "+(g+1)+" 组";
    container.appendChild(groupTitle);

    for(var i=start;i<end;i++){
      var s=allSites[i];
      var isFault=s.uptime_day<100;
      var card=document.createElement("div");
      card.dataset.siteName=s.name;
      card.dataset.isFault=isFault?"1":"0";
      card.style.cssText="background:#fff;border-left:4px solid "+(isFault?"#e53e3e":"#38a169")+";padding:14px 16px;margin-bottom:8px;border-radius:0 8px 8px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);";

      var nameHtml='<a href="'+s.url+'" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;font-weight:bold;font-size:15px;display:block;margin-bottom:6px;">'+s.name+'</a>';
      var uptimeHtml='<div style="font-size:13px;color:#666;margin-bottom:2px;">可用率: '+s.uptime_overall.toFixed(2)+'%</div>';
      var rtHtml='<div style="font-size:13px;color:'+(s.rt_overall>2000?"#e6a23c":"#666")+';font-weight:'+(s.rt_overall>2000?"bold":"normal")+';">平均响应: '+s.rt_overall+' ms</div>';

      card.innerHTML=nameHtml+uptimeHtml+rtHtml;
      container.appendChild(card);
    }
  }

  siteSection.appendChild(container);

  // 搜索
  document.getElementById("__search__").oninput=function(){
    var q=this.value.trim().toLowerCase();
    var cards=container.querySelectorAll("[data-site-name]");
    for(var i=0;i<cards.length;i++){
      cards[i].style.display=(!q||cards[i].dataset.siteName.toLowerCase().indexOf(q)!==-1)?"":"none";
    }
  };

  // 只看故障
  document.getElementById("__faultonly__").onchange=function(){
    var showFault=this.checked;
    var cards=container.querySelectorAll("[data-site-name]");
    for(var i=0;i<cards.length;i++){
      cards[i].style.display=(showFault&&cards[i].dataset.isFault!=="1")?"none":"";
    }
  };

  // 暗色
  document.getElementById("__dark__").onclick=function(){
    document.body.classList.toggle("dark-mode");
  };

  // 把活跃事件 section 移到最后
  if(sections.length>=1){
    var firstSection=sections[0];
    if(!firstSection.dataset.moved){
      document.querySelector("main").appendChild(firstSection);
      firstSection.dataset.moved="1";
    }
  }
}

function loadData(){
  fetch(SITES_DATA_URL)
    .then(function(r){return r.json();})
    .then(function(sites){
      renderSites(sites);
      tr();
      hideStuff();
    })
    .catch(function(e){
      console.error("加载数据失败:",e);
      // 3秒后重试
      setTimeout(loadData,3000);
    });
}

// 暗色模式样式
var darkCss=document.createElement("style");
darkCss.textContent=".dark-mode{filter:invert(1) hue-rotate(180deg);}.dark-mode img,.dark-mode canvas,.dark-mode svg{filter:invert(1) hue-rotate(180deg);}";
document.head.appendChild(darkCss);

// 密码门
function showGate(){
  if(sessionStorage.getItem("authed")==="1"){
    start();
    return;
  }
  var g=document.createElement("div");
  g.id="__gate__";
  g.style.cssText="position:fixed;inset:0;z-index:99999;background:#f5f6f8;display:flex;align-items:center;justify-content:center;font-family:sans-serif;";
  g.innerHTML='<div style="background:#fff;padding:32px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.1);width:300px;">'+
    '<h2 style="margin:0 0 8px;font-size:20px;color:#333;">受限访问</h2>'+
    '<p style="margin:0 0 20px;font-size:13px;color:#888;">请输入访问密码</p>'+
    '<input id="__pw__" type="password" placeholder="密码" style="width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box;outline:none;" />'+
    '<p id="__err__" style="color:#e53e3e;font-size:13px;margin:8px 0 0;display:none;">密码错误</p>'+
    '<button id="__btn__" style="width:100%;margin-top:16px;padding:10px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;">进入</button>'+
    '</div>';
  document.body.appendChild(g);
  document.body.style.overflow="hidden";
  var inp=document.getElementById("__pw__");
  var btn=document.getElementById("__btn__");
  var err=document.getElementById("__err__");
  inp.focus();
  function ok(){
    var pw=inp.value;
    var enc=new TextEncoder();
    crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveBits"])
      .then(function(km){
        var salt=Uint8Array.from(atob("x/cY1/bAkKKTJaOXTChMmQ=="),function(c){return c.charCodeAt(0);});
        return crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,256);
      })
      .then(function(bits){
        var hash=btoa(String.fromCharCode.apply(null,new Uint8Array(bits)));
        if(GOODHASHES.indexOf(hash)!==-1){
          sessionStorage.setItem("authed","1");
          g.remove();
          document.body.style.overflow="";
          start();
        }else{
          err.style.display="block";
          inp.value="";
          inp.focus();
        }
      });
  }
  btn.onclick=ok;
  inp.onkeydown=function(e){if(e.key==="Enter")ok();};
}

function start(){
  // 等 Sapper 渲染出 DOM
  function waitForDOM(){
    var sections=document.querySelectorAll("main > section.svelte-8lnl4f");
    if(sections.length>=2){
      loadData();
    }else{
      setTimeout(waitForDOM,500);
    }
  }
  waitForDOM();

  // 持续翻译
  var mo=new MutationObserver(function(){
    tr();
    hideStuff();
  });
  mo.observe(document.body,{childList:true,subtree:true});
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",showGate);
}else{
  showGate();
}
})();
