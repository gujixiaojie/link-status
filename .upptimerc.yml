# Change these first
owner: gujixiaojie # Your GitHub organization or username, where this repository lives
repo: link-status # The name of this repository

sites:
  - name: Baidu
    url: https://www.baidu.com
  - name: Bilibili
    url: https://www.bilibili.com
  - name: GitHub
    url: https://github.com

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: demo.upptime.js.org
  baseUrl: /link-status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Link Status
  introTitle: "**Link Status** is the open-source uptime monitor and status page, powered entirely by GitHub."
  introMessage: This status page monitors the availability of my favorite sites, powered by GitHub Actions and Upptime.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
